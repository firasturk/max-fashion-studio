name: Studio assistant
# Changes to the studio asked for in the in-app chat. The run asks the studio for the next job,
# the developer agent edits the code, the workflow checks, deploys and pushes, and reports back.
# Secrets: STUDIO_HOOK_TOKEN (shown in Connection → Developer), ANTHROPIC_API_KEY, CLOUDFLARE_API_TOKEN.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [assistant-change]
concurrency:
  group: studio-assistant
  cancel-in-progress: false
permissions:
  contents: write
env:
  STUDIO_URL: https://max-fashion-studio.max-fashion-studio.workers.dev
jobs:
  change:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HOOK_TOKEN: ${{ secrets.STUDIO_HOOK_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: e7331236c05517364ee6a02c2c19a6fd
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Ask the studio for the next job
        id: claim
        run: |
          if [ -z "$HOOK_TOKEN" ]; then echo "STUDIO_HOOK_TOKEN secret is missing"; exit 1; fi
          code=$(curl -sS -o job.json -w '%{http_code}' -X POST "$STUDIO_URL/api/hooks/dev-jobs/next" \
            -H "Content-Type: application/json" \
            -d "$(jq -cn --arg token "$HOOK_TOKEN" --arg url "$RUN_URL" '{token:$token, run_url:$url}')")
          if [ "$code" = "204" ]; then echo "nothing to do"; echo "has_job=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$code" != "200" ]; then echo "studio answered $code"; cat job.json; exit 1; fi
          echo "has_job=true" >> "$GITHUB_OUTPUT"
          echo "JOB_ID=$(jq -r .id job.json)" >> "$GITHUB_ENV"
          jq -r .request job.json > request.md
          jq -r .context job.json > context.md
          echo "job $(jq -r .id job.json)"
      - uses: actions/checkout@v4
        if: steps.claim.outputs.has_job == 'true'
        with:
          ref: main
          fetch-depth: 0
          path: repo
      - uses: pnpm/action-setup@v4
        if: steps.claim.outputs.has_job == 'true'
        with: { version: 10 }
      - uses: actions/setup-node@v4
        if: steps.claim.outputs.has_job == 'true'
        with: { node-version: 22 }
      - name: Install
        if: steps.claim.outputs.has_job == 'true'
        working-directory: repo
        run: |
          pnpm install --frozen-lockfile
          mkdir -p server/generated
          printf '// Generated by scripts/embed-assets.mjs. Do not edit.\nexport const ASSETS: Record<string, { type: string; data: string }> = {};\n' > server/generated/assets.ts
      - name: Check the credentials
        if: steps.claim.outputs.has_job == 'true'
        run: |
          key="$(printf %s "$ANTHROPIC_API_KEY" | tr -d '[:space:]')"
          echo "ANTHROPIC_API_KEY=$key" >> "$GITHUB_ENV"
          code=$(curl -sS -o /dev/null -w '%{http_code}' https://api.anthropic.com/v1/models \
            -H "x-api-key: $key" -H "anthropic-version: 2023-06-01")
          if [ "$code" != "200" ]; then
            echo "CREDENTIAL_ERROR=The GitHub secret ANTHROPIC_API_KEY is rejected by Anthropic (HTTP $code). Open the repository's Settings → Secrets and variables → Actions, Update ANTHROPIC_API_KEY with a key from platform.claude.com/settings/keys (it starts with sk-ant-), with no spaces." >> "$GITHUB_ENV"
            echo "Anthropic rejected the key (HTTP $code), length ${#key}"; exit 1
          fi
          echo "Anthropic key accepted"
          cf=$(curl -sS -o /dev/null -w '%{http_code}' https://api.cloudflare.com/client/v4/user/tokens/verify \
            -H "Authorization: Bearer $(printf %s "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')")
          if [ "$cf" != "200" ]; then
            echo "CREDENTIAL_ERROR=The GitHub secret CLOUDFLARE_API_TOKEN is rejected by Cloudflare (HTTP $cf). Update it with a token created at dash.cloudflare.com/profile/api-tokens (template Edit Cloudflare Workers)." >> "$GITHUB_ENV"
            echo "Cloudflare rejected the token (HTTP $cf)"; exit 1
          fi
          echo "Cloudflare token accepted"
      - name: Developer agent
        if: steps.claim.outputs.has_job == 'true'
        working-directory: repo
        run: |
          mkdir -p .assistant/run
          printf '%s\n\n---\n\n## Request from the team\n\n%s\n\n## Context (batch, image, settings)\n\n%s\n' \
            "$(cat .assistant/PROMPT.md)" "$(cat ../request.md)" "$(cat ../context.md)" > .assistant/run/prompt.md
          npx -y @anthropic-ai/claude-code@latest -p "$(cat .assistant/run/prompt.md)" \
            --dangerously-skip-permissions --output-format json --max-turns 120 \
            > .assistant/run/out.json || { echo "agent failed"; tail -c 2000 .assistant/run/out.json; exit 1; }
          jq -r '.result // empty' .assistant/run/out.json > .assistant/run/result.txt
          echo "--- agent report ---"; cat .assistant/run/result.txt
      - name: Check
        if: steps.claim.outputs.has_job == 'true'
        working-directory: repo
        run: pnpm check
      - name: Migrate and deploy
        if: steps.claim.outputs.has_job == 'true'
        working-directory: repo
        run: |
          npx wrangler d1 migrations apply max-fashion-studio --remote
          pnpm run deploy
      - name: Commit and push
        if: steps.claim.outputs.has_job == 'true'
        working-directory: repo
        run: |
          git config user.name "Studio assistant"
          git config user.email "studio-assistant@users.noreply.github.com"
          git add -A
          git reset -q -- .assistant/run server/generated wrangler.deploy.json || true
          if git diff --cached --quiet; then echo "nothing to commit"; else
            SUMMARY=$(head -c 72 .assistant/run/result.txt | tr '\n' ' ')
            git commit -m "Assistant: ${SUMMARY:-change requested in the studio chat}" -m "$(cat ../request.md)"
            git push origin HEAD:main
          fi
      - name: Report done
        if: success() && steps.claim.outputs.has_job == 'true'
        run: |
          curl -sS -X POST "$STUDIO_URL/api/hooks/dev-job" -H "Content-Type: application/json" \
            -d "$(jq -cn --arg job "$JOB_ID" --arg token "$HOOK_TOKEN" --arg url "$RUN_URL" --rawfile result repo/.assistant/run/result.txt '{job:$job, token:$token, status:"done", run_url:$url, result:$result}')" || true
      - name: Report failure
        if: failure() && steps.claim.outputs.has_job == 'true'
        run: |
          RESULT="The change could not be completed: a step failed (see the run). Nothing was deployed."
          [ -n "$CREDENTIAL_ERROR" ] && RESULT="$CREDENTIAL_ERROR Nothing was deployed; the request stays in the queue and runs once the secret is fixed."
          if [ -f repo/.assistant/run/out.json ]; then
            AGENT=$(jq -r 'if .is_error then .result else empty end' repo/.assistant/run/out.json 2>/dev/null | head -c 400)
            [ -n "$AGENT" ] && RESULT="$RESULT Agent error: $AGENT"
          fi
          [ -s repo/.assistant/run/result.txt ] && RESULT="$RESULT Agent report: $(head -c 800 repo/.assistant/run/result.txt)"
          STATUS="failed"; [ -n "$CREDENTIAL_ERROR" ] && STATUS="queued"
          curl -sS -X POST "$STUDIO_URL/api/hooks/dev-job" -H "Content-Type: application/json" \
            -d "$(jq -cn --arg job "$JOB_ID" --arg token "$HOOK_TOKEN" --arg url "$RUN_URL" --arg result "$RESULT" --arg status "$STATUS" '{job:$job, token:$token, status:$status, run_url:$url, result:$result}')" || true
