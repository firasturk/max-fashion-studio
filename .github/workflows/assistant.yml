name: Studio assistant
# A change to the studio asked for in the in-app chat: the developer agent edits the code, the
# workflow checks, deploys and pushes, and reports back to the studio.
on:
  repository_dispatch:
    types: [assistant-change]
concurrency:
  group: studio-assistant
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  change:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      JOB_ID: ${{ github.event.client_payload.job }}
      HOOK: ${{ github.event.client_payload.hook }}
      HOOK_TOKEN: ${{ github.event.client_payload.token }}
      REQUEST: ${{ github.event.client_payload.request }}
      REQUEST_CONTEXT: ${{ github.event.client_payload.context }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Report running
        run: |
          [ -z "$HOOK" ] || curl -sS -X POST "$HOOK" -H "Content-Type: application/json" \
            -d "$(jq -cn --arg job "$JOB_ID" --arg token "$HOOK_TOKEN" --arg url "$RUN_URL" '{job:$job, token:$token, status:"running", run_url:$url}')" || true
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Seed generated assets (the build regenerates them)
        run: |
          mkdir -p server/generated
          printf '// Generated by scripts/embed-assets.mjs. Do not edit.\nexport const ASSETS: Record<string, { type: string; data: string }> = {};\n' > server/generated/assets.ts
      - name: Write the request
        run: |
          mkdir -p .assistant/run
          printf '%s\n\n---\n\n## Request from the team\n\n%s\n\n## Context (batch, image, settings)\n\n%s\n' "$(cat .assistant/PROMPT.md)" "$REQUEST" "$REQUEST_CONTEXT" > .assistant/run/prompt.md
      - name: Developer agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          npx -y @anthropic-ai/claude-code@latest -p "$(cat .assistant/run/prompt.md)" \
            --dangerously-skip-permissions --output-format json --max-turns 120 \
            > .assistant/run/out.json || { echo "agent failed"; tail -c 2000 .assistant/run/out.json; exit 1; }
          jq -r '.result // empty' .assistant/run/out.json > .assistant/run/result.txt
          echo "--- agent report ---"; cat .assistant/run/result.txt
      - name: Check
        run: pnpm check
      - name: Migrate and deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 migrations apply max-fashion-studio --remote
          pnpm run deploy
      - name: Commit and push
        run: |
          git config user.name "Studio assistant"
          git config user.email "studio-assistant@users.noreply.github.com"
          git add -A
          git reset -q -- .assistant/run server/generated wrangler.deploy.json || true
          if git diff --cached --quiet; then echo "nothing to commit"; else
            SUMMARY=$(head -c 72 .assistant/run/result.txt | tr '\n' ' ')
            git commit -m "Assistant: ${SUMMARY:-change requested in the studio chat}" -m "$REQUEST"
            git push origin HEAD:main
          fi
      - name: Report done
        if: success()
        run: |
          [ -z "$HOOK" ] || curl -sS -X POST "$HOOK" -H "Content-Type: application/json" \
            -d "$(jq -cn --arg job "$JOB_ID" --arg token "$HOOK_TOKEN" --arg url "$RUN_URL" --rawfile result .assistant/run/result.txt '{job:$job, token:$token, status:"done", run_url:$url, result:$result}')" || true
      - name: Report failure
        if: failure()
        run: |
          RESULT="The change could not be completed: a step failed (see the run). Nothing was deployed."
          [ -f .assistant/run/result.txt ] && RESULT="$RESULT Agent report: $(head -c 800 .assistant/run/result.txt)"
          [ -z "$HOOK" ] || curl -sS -X POST "$HOOK" -H "Content-Type: application/json" \
            -d "$(jq -cn --arg job "$JOB_ID" --arg token "$HOOK_TOKEN" --arg url "$RUN_URL" --arg result "$RESULT" '{job:$job, token:$token, status:"failed", run_url:$url, result:$result}')" || true
